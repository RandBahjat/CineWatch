<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download CineWatch</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #030406;
            color: #f1f5f9;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }

        .ambient-glow {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 700px;
            background: radial-gradient(circle, rgba(229,9,20,0.12) 0%, transparent 65%);
            z-index: -1;
            filter: blur(90px);
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0%   { opacity: 0.6; transform: translate(-50%, -50%) scale(1);    }
            100% { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        /* ── Navbar ── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 68px;
            background: rgba(3,4,6,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }
        .brand-logo .accent { color: #e50914; }

        /* ── Page ── */
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 130px 2rem 8rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ── Hero ── */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(229,9,20,0.08);
            border: 1px solid rgba(229,9,20,0.2);
            color: #ff3344;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.1s forwards;
        }
        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 1.4rem;
            color: #fff;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.2s forwards;
        }
        .text-dim { color: #71717a; }
        .hero-desc {
            font-size: 1.15rem;
            color: #94a3b8;
            line-height: 1.65;
            max-width: 580px;
            margin-bottom: 2.8rem;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.3s forwards;
        }

        /* ── Platform label ── */
        .platform-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.8rem;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.4s forwards;
        }
        .platform-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #52525b;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .platform-row::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        /* ── Buttons ── */
        .dl-btn-row {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.45s forwards;
        }
        .btn-dl {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.95rem 2.2rem;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2,0.8,0.2,1);
        }
        .btn-dl ion-icon { font-size: 1.25rem; }
        .btn-win {
            background: #fff;
            color: #000;
            box-shadow: 0 8px 28px rgba(255,255,255,0.12);
        }
        .btn-win:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 40px rgba(255,255,255,0.22);
        }
        .sys-note { font-size: 0.8rem; color: #3f3f46; }

        /* ── Desktop Window ── */
        .showcase-wrap {
            width: 100%;
            margin-bottom: 7rem;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.55s forwards;
        }
        .win-chrome {
            background: rgba(12,14,22,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 32px 100px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .win-titlebar {
            height: 36px;
            background: rgba(8,10,16,0.98);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-title-text {
            font-size: 0.72rem;
            color: #3f3f46;
            letter-spacing: 0.4px;
        }
        .win-content {
            width: 100%;
            height: 520px;
            overflow: hidden;
            background: #06070a;
            position: relative;
        }
        /* Scale the app iframe (cinewatch-app) to fit the window */
        .win-content iframe {
            width: 150%;
            height: 150%;
            border: none;
            transform: scale(0.667);
            transform-origin: top left;
            pointer-events: none;
        }
        .win-content::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background: linear-gradient(to top, rgba(8,10,16,1), transparent);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .win-content { height: 300px; }
        }
    </style>
  <!-- Force iframe cache bust on every load -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('iframe').forEach(f => {
        const base = 'cinewatch-app/index.html';
        f.src = base + '?bust=' + Date.now();
      });
    });
  </script>
</head>
<body>
    <div class="ambient-glow"></div>

    <header class="navbar">
        <a href="index.html" class="brand-logo">
            <span style="color:#e50914;font-size:1.4rem;display:flex;align-items:center;">
                <ion-icon name="ticket"></ion-icon>
            </span>
            <span>Cine<span class="accent">Watch</span></span>
        </a>
    </header>

    <main class="page">

        <!-- HERO -->
        <div class="hero-badge"><ion-icon name="flash"></ion-icon>&nbsp; NEW &mdash; V1.2.6</div>
        <h1 class="hero-title"><span class="text-dim">Streamlined</span> for Desktop.</h1>
        <p class="hero-desc">Experience an ultra-fast, immersive, and ad-free cinematic layout. CineWatch brings the ultimate streaming environment straight to your device.</p>

        <!-- ══ WINDOWS ══ -->
        <div class="platform-row">
            <div class="platform-label"><ion-icon name="logo-windows"></ion-icon> Windows Desktop</div>
        </div>

        <div class="dl-btn-row">
            <a href="https://github.com/RandBahjat/CineWatch/releases/latest/download/CineWatch-v1.2.6-Setup.exe"
               class="btn-dl btn-win">
                <ion-icon name="logo-windows"></ion-icon>
                <span>Download for Windows</span>
            </a>
            <div class="sys-note">Windows 10 / 11 &bull; 64-bit &bull; Free</div>
        </div>

        <!-- Desktop window — embeds the DESKTOP APP (cinewatch-app/index.html) -->
        <div class="showcase-wrap">
            <div class="win-chrome">
                <div class="win-titlebar">
                    <span class="win-title-text">CineWatch App &mdash; Home</span>
                </div>
                <div class="win-content">
                    <iframe
                        src="cinewatch-app/index.html"
                        title="CineWatch Desktop App Preview"
                        scrolling="no"
                        sandbox="allow-scripts allow-same-origin"
                    ></iframe>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
