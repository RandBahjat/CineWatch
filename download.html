<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download CineWatch</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="movie.css?v=20260901">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        body {
            background-color: #030406;
            color: #f1f5f9;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 600px;
            background: radial-gradient(circle, rgba(229,9,20,0.15) 0%, transparent 60%);
            z-index: -1;
            filter: blur(60px);
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Navbar Override */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(3, 4, 6, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }
        .brand-logo .logo-accent { color: #e50914; }
        .logo-icon ion-icon { color: #e50914; font-size: 1.4rem; }

        /* Main Content */
        .download-landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 140px 2rem 4rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.2);
            color: #ff3344;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            animation: fadeUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 1.5rem;
            color: #fff;
            animation: fadeUp 0.8s ease-out 0.1s forwards;
            opacity: 0;
        }

        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero-desc {
            font-size: 1.25rem;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 650px;
            margin-bottom: 3rem;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        .download-btn-wrap {
            animation: fadeUp 0.8s ease-out 0.3s forwards;
            opacity: 0;
        }

        .btn-download-main {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 1.2rem 2.8rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .btn-download-main:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.25);
        }

        .btn-download-main ion-icon {
            font-size: 1.4rem;
        }

        .sys-req {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        /* Mockup Glass Showcase */
        .showcase-wrap {
            margin-top: 5rem;
            width: 100%;
            perspective: 1000px;
            animation: fadeUp 1s ease-out 0.4s forwards;
            opacity: 0;
        }

        .showcase-window {
            width: 100%;
            background: rgba(20, 22, 30, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
        }

        .showcase-header {
            height: 36px;
            background: rgba(10, 12, 18, 0.6);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #334155;
        }
        .dot.r { background: #ef4444; }
        .dot.y { background: #eab308; }
        .dot.g { background: #22c55e; }

        .showcase-body {
            height: 480px;
            background-image: url('https://image.tmdb.org/t/p/original/8rpDcsfLJypbO6vtecsm1p2P90.jpg'); /* Beautiful cinematic image */
            background-size: cover;
            background-position: center 20%;
            position: relative;
        }

        .showcase-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 12, 18, 0.9) 0%, transparent 60%);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .hero-desc { font-size: 1.1rem; }
            .showcase-body { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header class="navbar">
        <a href="index.html" class="brand-logo">
            <span class="logo-icon"><ion-icon name="ticket"></ion-icon></span>
            <span class="logo-text">Cine<span class="logo-accent">Watch</span></span>
        </a>
    </header>

    <main class="download-landing">
        <div class="hero-badge">
            <ion-icon name="flash"></ion-icon> NEW V1.2.5
        </div>
        <h1 class="hero-title"><span class="text-gradient">Streamlined</span> for Desktop.</h1>
        <p class="hero-desc">Experience an ultra-fast, immersive, and ad-free cinematic layout. CineWatch Desktop brings the ultimate streaming environment straight to your PC.</p>
        
        <div class="download-btn-wrap">
            <a href="https://github.com/RandBahjat/CineWatch/releases/latest/download/CineWatch-v1.2.5-Setup.exe" class="btn-download-main">
                <ion-icon name="logo-windows"></ion-icon>
                <span>Download for Windows</span>
            </a>
            <div class="sys-req">Windows 10/11 • 64-bit</div>
        </div>

        <div class="showcase-wrap">
            <div class="showcase-window">
                <div class="showcase-header">
                    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
                </div>
                <div class="showcase-body"></div>
            </div>
        </div>
    </main>
</body>
</html>
