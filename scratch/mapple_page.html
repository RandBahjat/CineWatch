:root {
  --bprogress-color: #ff4533;
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px #ff4533, 0 0 5px #ff4533;
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

lauriers\",\"adult\":false,\"gender\":1,\"credit_id\":\"6a44612f87e1472065e71e61\",\"department\":\"Art\",\"popularity\":0.3925,\"profile_path\":null,\"original_name\":\"Liesl Deslauriers\",\"known_for_department\":\"Art\"},{\"id\":1799635,\"job\":\"Script Coordinator\",\"name\":\"Greg Yeoman\",\"adult\":false,\"gender\":2,\"credit_id\":\"6a7c4cee7e1f0b6533643fc5\",\"department\":\"Directing\",\"popularity\":0.6193,\"profile_path\":null,\"original_name\":\"Greg Yeoman\",\"known_for_department\":\"Writing\"}]},\"reviews\":{\"page\":1,\"results\":[{\"id\":\"63e74c8063aad200e05c90d5\",\"url\":\"https://www.themoviedb.org/review/63e74c8063aad200e05c90d5\",\"author\":\"charles338\",\"content\":\"Bought Reacher: Season 1 on Blu-Ray. I absolutely Loved the series and I hope Amazon will continue filming it. The actor that plays Reacher in the series \\\"to me any way,\\\" fits closer to the description that Lee Child has in his books. Not to take anything away from Tom Cruise and the movies that he played Jack Reacher in, because he had a smaller frame. Both actors did a fantastic acting job in their films which I also have. Top class acting from both Alan Ritchson and Tom Cruise. I also have Lee Child's books and if it wasn't for him writing such fantastic novels we would not have these great films.\",\"created_at\":\"2023-02-11T08:06:24Z\",\"updated_at\":\"2023-02-15T15:38:17Z\",\"author_details\":{\"name\":\"\",\"rating\":null,\"username\":\"charles338\",\"avatar_path\":null}},{\"id\":\"65ab61170c4c1600c57bd9ce\",\"url\":\"https://www.themoviedb.org/review/65ab61170c4c1600c57bd9ce\",\"author\":\"misubisu\",\"content\":\"Season one was a 10/10 show. I LOVED it.\\r\\nI waited with eager anticipation for season two... and when I finally got to watch it, I was so disappointed.\\r\\nIn season one, Reacher was larger than life. In season two he just seemed les significant. Season two is 7/10. Still worth the watch, but just don't expect the same va-va-voom that season one had.\",\"created_at\":\"2024-01-20T05:58:47Z\",\"updated_at\":\"2024-01-20T05:58:47Z\",\"author_details\":{\"name\":\"misubisu\",\"rating\":8,\"username\":\"misubisu\",\"avatar_path\":\"/gYANFSSdtvtcGZqi2J2xzxRmQBx.jpg\"}},{\"id\":\"65bda8b86c449c01308bd746\",\"url\":\"https://www.themoviedb.org/review/65bda8b86c449c01308bd746\",\"author\":\"jw\",\"content\":\"$36\",\"created_at\":\"2024-02-03T02:45:12Z\",\"updated_at\":\"2024-02-05T17:54:26Z\",\"author_details\":{\"name\":\"\",\"rating\":5,\"username\":\"jw\",\"avatar_path\":null}},{\"id\":\"65f9f1521cfe3a0186f742d3\",\"url\":\"https://www.themoviedb.org/review/65f9f1521cfe3a0186f742d3\",\"author\":\"cavemanharris\",\"content\":\"Season 1 of Reacher blew me away! Pure Jack Reacher - a one-man wrecking crew taking down bad guys. But season 2? Yikes. It felt like a cheap action movie showcasing a bunch of ex-military buddies instead. Lost the whole \\\"lone wolf\\\" vibe that made Reacher so cool. Should've called it \\\"Reacher and the Misfit Battalion.\\\"\",\"created_at\":\"2024-03-19T20:10:58Z\",\"updated_at\":\"2024-04-02T16:52:13Z\",\"author_details\":{\"name\":\"\",\"rating\":null,\"username\":\"cavemanharris\",\"avatar_path\":null}},{\"id\":\"68c4706dc8af3b72764dd140\",\"url\":\"https://www.themoviedb.org/review/68c4706dc8af3b72764dd140\",\"author\":\"Dean\",\"content\":\"Great show. No propaganda and woke BS. Reacher is a great, big good guy. Show has likable characters and a lot of action. It's much better than movie. Highly recommended!\",\"created_at\":\"2025-09-12T19:11:41Z\",\"updated_at\":\"2025-09-12T19:13:51Z\",\"author_details\":{\"name\":\"Dean\",\"rating\":10,\"username\":\"Ditendra\",\"avatar_path\":\"/mWNyjPiqEYQkF3sfWKz3gV6dcji.jpg\"}},{\"id\":\"6a86aae24fba95aed14288f8\",\"url\":\"https://www.themoviedb.org/review/6a86aae24fba95aed14288f8\",\"author\":\"its.zeeshan5437404\",\"content\":\"*Reacher* (2022) is such a great example of a series that gets the balance between action, mystery, and character development right. Alan Ritchson’s performance really makes Reacher feel like the larger-than-life character fans expect, while the investigation keeps the story moving. Definitely a must-watch for action and thriller fans.\",\"created_at\":\"2026-08-20T07:21:06Z\",\"updated_at\":\"2026-08-20T14:25:15Z\",\"author_details\":{\"name\":\"\",\"rating\":null,\"username\":\"its.zeeshan5437404\",\"avatar_path\":null}}],\"total_pages\":1,\"total_results\":6},\"seasons\":[{\"id\":161571,\"name\":\"Season 1\",\"air_date\":\"2022-02-03\",\"overview\":\"Based on \\\"Killing Floor,\\\" when retired Military Police Officer Jack Reacher is arrested for a murder he did not commit, he finds himself in the middle of a deadly conspiracy full of dirty cops, shady businessmen and scheming politicians. With nothing but his wits, he must figure out what is happening in Margrave, Georgia.\",\"poster_path\":\"/aylSycUpdCQzN7nRrPDL2EZwp5a.jpg\",\"vote_average\":7.7,\"episode_count\":8,\"season_number\":1},{\"id\":364732,\"name\":\"Season 2\",\"air_date\":\"2023-12-14\",\"overview\":\"Based on \\\"Bad Luck and Trouble,\\\" when members of Reacher's old military unit start turning up dead, Reacher has just one thing on his mind—revenge.\",\"poster_path\":\"/rQRe3ydBYGoyr1mgxUeGHVs2lw5.jpg\",\"vote_average\":6.9,\"episode_count\":8,\"season_number\":2},{\"id\":432260,\"name\":\"Season 3\",\"air_date\":\"2025-02-20\",\"overview\":\"Based on \\\"Persuader,\\\" Reacher hurtles into the dark heart of a vast criminal enterprise when trying to rescue an undercover DEA informant whose time is running out. There he finds a world of secrecy and violence—and confronts some unfinished business from his own past.\",\"poster_path\":\"/31GlRQMiDunO8cl3NxTz34U64rf.jpg\",\"vote_average\":7.4,\"episode_count\":8,\"season_number\":3},{\"id\":525713,\"name\":\"Season 4\",\"air_date\":\"2026-08-12\",\"overview\":\"Based on \\\"Gone Tomorrow,\\\" when a chance encounter with a distraught stranger on a subway goes horribly wrong, Jack Reacher is drawn into a complex and deadly game that pits him against ruthless foes from the highest echelons of power.\",\"poster_path\":\"/f1VCQIG2iCyOookdgOzwtUpwWC0.jpg\",\"vote_average\":6.7,\"episode_count\":8,\"season_number\":4}],\"tagline\":\"Reacher's back.\",\"homepage\":\"https://www.amazon.com/dp/B09ML1ZF3D\",\"keywords\":{\"results\":[{\"id\":782,\"name\":\"assassin\"},{\"id\":818,\"name\":\"based on novel or book\"},{\"id\":1419,\"name\":\"gun\"},{\"id\":5265,\"name\":\"espionage\"},{\"id\":6149,\"name\":\"police\"},{\"id\":6178,\"name\":\"newfoundland and labrador\"},{\"id\":10410,\"name\":\"conspiracy\"},{\"id\":33705,\"name\":\"agent\"},{\"id\":161184,\"name\":\"reboot\"},{\"id\":161249,\"name\":\"military police\"}]},\"networks\":[{\"id\":1024,\"name\":\"Prime Video\",\"logo_path\":\"/w7HfLNm9CWwRmAMU58udl2L7We7.png\",\"origin_country\":\"\"}],\"overview\":\"Jack Reacher, a veteran military police investigator, has just recently entered civilian life. Reacher is a drifter, carrying no phone and the barest of essentials as he travels the country and explores the nation he once served.\",\"softcore\":false,\"languages\":[\"en\"],\"created_by\":[{\"id\":78417,\"name\":\"Nick Santora\",\"gender\":2,\"credit_id\":\"5f54f833713ed40036eed3e7\",\"profile_path\":\"/iipP9fTQhRuPJHFMhbpMCceBiiu.jpg\",\"original_name\":\"Nick Santora\"}],\"popularity\":633.2375,\"vote_count\":3259,\"poster_path\":\"/f1VCQIG2iCyOookdgOzwtUpwWC0.jpg\",\"translations\":{\"translations\":[{\"data\":{\"name\":\"Ричер\",\"tagline\":\"«Ричер вернулся»\",\"homepage\":\"\",\"overview\":\"Отставной офицер военной полиции Джек Ричер, будучи арестованным за убийство, которого не совершал, оказывается в эпицентре смертельного заговора, в который втянуты продажные полицейские, теневые бизнесмены и коварные политики.\"},\"name\":\"Pусский\",\"iso_639_1\":\"ru\",\"iso_3166_1\":\"RU\",\"english_name\":\"Russian\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher's back.\",\"homepage\":\"\",\"overview\":\"Jack Reacher, a veteran military police investigator, has just recently entered civilian life. Reacher is a drifter, carrying no phone and the barest of essentials as he travels the country and explores the nation he once served.\"},\"name\":\"English\",\"iso_639_1\":\"en\",\"iso_3166_1\":\"US\",\"english_name\":\"English\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher está de volta.\",\"homepage\":\"\",\"overview\":\"Quando o policial militar aposentado Jack Reacher é preso por um assassinato que não cometeu, ele se vê no meio de uma trama mortal cheia de policiais corruptos, empresários obscuros e políticos conspiradores. Só com sua inteligência, ele precisa descobrir o que está havendo em Margrave, Geórgia.\"},\"name\":\"Português\",\"iso_639_1\":\"pt\",\"iso_3166_1\":\"BR\",\"english_name\":\"Portuguese\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher est de retour.\",\"homepage\":\"\",\"overview\":\"Ancien officier de Police Militaire, Jack Reacher est arrêté pour un meurtre qu'il n'a pas commis et découvre une conspiration sanglante où baignent flics véreux, hommes d'affaire louches et politiciens corrompus. Avec son astuce pour seule arme, il va déjouer ce qui se trame à Margrave en Géorgie.\"},\"name\":\"Français\",\"iso_639_1\":\"fr\",\"iso_3166_1\":\"FR\",\"english_name\":\"French\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Als Ex Militärpolizist Jack Reacher wegen eines Mordes, den er nicht begangen hat, verhaftet wird, findet er sich inmitten einer tödlichen Verschwörung korrupter Polizisten, dubioser Geschäftsleute und intriganter Politiker wieder und muss herausfinden, was in Margrave, Georgia, vor sich geht. Die erste Staffel von Reacher basiert auf dem internationalen Bestseller Größenwahn von Lee Child.\"},\"name\":\"Deutsch\",\"iso_639_1\":\"de\",\"iso_3166_1\":\"DE\",\"english_name\":\"German\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher geri döndü.\",\"homepage\":\"\",\"overview\":\"Emekli Askerî Polis Subayı Jack Reacher işlemediği bir cinayetten tutuklanınca kendini kirli polisler, karanlık iş adamları ve yozlaşmış siyasetçilerle dolu ölümcül bir komplonun ortasında bulur. Aklından başka bir şeyi olmayan Reacher Margrave, Georgia'da neler döndüğünü çözmek zorunda kalacaktır.\"},\"name\":\"Türkçe\",\"iso_639_1\":\"tr\",\"iso_3166_1\":\"TR\",\"english_name\":\"Turkish\"},{\"data\":{\"name\":\"리처\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"은퇴한 헌병 대원 잭 리처는 자신이 저지르지 않은 살인으로 체포되고, 이내 자신이 부패한 경찰, 수상쩍은 사업가, 교활한 정치가들이 판치는 음모의 한 가운데 있음을 알게 된다. 리처는 오직 자신의 지혜만을 가지고 조지아주 마그레이브에서 무슨 일이 일어나고 있는지 알아내야 한다.\"},\"name\":\"한국어/조선말\",\"iso_639_1\":\"ko\",\"iso_3166_1\":\"KR\",\"english_name\":\"Korean\"},{\"data\":{\"name\":\"Jack Reacher\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Když je příslušník Vojenské policie ve výslužbě Jack Reacher zatčen za vraždu, kterou nespáchal, ocitne se ve středu smrtícího spiknutí plného zkorumpovaných policistů, zrádných obchodníků a intrikujících politiků. Jen s pomocí svých pěstí, musí odhalit, co se ve městě Margrave v Georgii skutečně děje.\"},\"name\":\"Český\",\"iso_639_1\":\"cs\",\"iso_3166_1\":\"CZ\",\"english_name\":\"Czech\"},{\"data\":{\"name\":\"\",\"tagline\":\"La ley tiene limites, él no los conoce...\",\"homepage\":\"\",\"overview\":\"Cuando lo arrestan por un asesinato que no cometió, el oficial retirado de la policía militar Jack Reacher se ve envuelto en una conspiración letal de policías corruptos, empresarios turbios y políticos intrigantes. Solo con su ingenio, debe descubrir qué está sucediendo en Margrave, Georgia. La primera temporada de \\\"Reacher\\\" se basa en la exitosa novela \\\"Zona peligrosa\\\" de Lee Child.\"},\"name\":\"Español\",\"iso_639_1\":\"es\",\"iso_3166_1\":\"MX\",\"english_name\":\"Spanish\"},{\"data\":{\"name\":\"俠客李奇\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"退伍憲兵傑克李奇遭人誣陷殺人而被逮捕，陷入一場充滿腐敗警察、可疑商人，及陰險政客的陰謀之中。他只能憑藉自己的聰慧，查出喬治亞州馬格雷夫到底發生什麼事。\"},\"name\":\"普通话\",\"iso_639_1\":\"zh\",\"iso_3166_1\":\"TW\",\"english_name\":\"Mandarin\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher är tillbaka.\",\"homepage\":\"\",\"overview\":\"Jack Reacher, en före detta militärpolis och utredare, har nyligen lämnat livet i armén bakom sig. Han är en kringresande vagabond som inte har någon telefon och bara det allra nödvändigaste med sig när han reser genom landet och utforskar den nation han en gång tjänade.\"},\"name\":\"svenska\",\"iso_639_1\":\"sv\",\"iso_3166_1\":\"SE\",\"english_name\":\"Swedish\"},{\"data\":{\"name\":\"侠探杰克\",\"tagline\":\"杰克回来了\",\"homepage\":\"\",\"overview\":\"退役宪兵警察杰克雷彻被误认为是谋杀嫌疑人而被捕，他发现自己卷入了一场致命的阴谋之中。这桩阴谋涉及了黑警、奸商以及狡诈的政客。他只能凭借自己的机智将佐治亚州马格雷夫的案件查个水落石出。\"},\"name\":\"普通话\",\"iso_639_1\":\"zh\",\"iso_3166_1\":\"CN\",\"english_name\":\"Mandarin\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher visszatért.\",\"homepage\":\"\",\"overview\":\"Amikor a volt katonai rendőrt, Jack Reachert letartóztatják egy gyilkosságért, amit el sem követett, egy korrupt zsarukkal, gyanús üzletemberekkel és cselszövő politikusokkal teli halálos összeesküvés közepébe csöppen. Muszáj neki kiderítenie, mi folyik Margrave-ben.\"},\"name\":\"Magyar\",\"iso_639_1\":\"hu\",\"iso_3166_1\":\"HU\",\"english_name\":\"Hungarian\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Cuando el exagente de la Policía Militar Jack Reacher es detenido por un asesinato que no ha cometido, se ve envuelto en una mortífera conspiración llena de policías corruptos, empresarios dudosos y políticos intrigantes. Armado solo con su ingenio, debe averiguar qué pasa en Margrave, Georgia. La primera temporada de Reacher se basa en Zona peligrosa, el superventas internacional de Lee Child.\"},\"name\":\"Español\",\"iso_639_1\":\"es\",\"iso_3166_1\":\"ES\",\"english_name\":\"Spanish\"},{\"data\":{\"name\":\"ריצ'ר\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"כשקצין המשטרה הצבאית המשוחרר, ג'ק ריצ'ר, נעצר בגין רצח שלא ביצע, הוא מוצא את עצמו בליבה של קנוניה קטלנית הגדושה בשוטרים מושחתים, אנשי עסקים מפוקפקים ופוליטיקאים תככנים. בעזרת תבונתו בלבד עליו לפענח מה קורה במרגרייב, ג'ורג'יה.\"},\"name\":\"עִבְרִית\",\"iso_639_1\":\"he\",\"iso_3166_1\":\"IL\",\"english_name\":\"Hebrew\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Jack Reacher is een veteraan, die als inspecteur bij de militaire politie heeft gewerkt. Nu probeert hij in het burgerlijk leven te integreren. Reacher reist het land door, zonder telefoon op zak en uitgerust met slechts het minimaal benodigde. Op zijn reizen doorkruist hij het land dat hij ooit gediend heeft. Wanneer Reacher aankomt in het kleine dorp Margrave in Georgia, is hij getuige van een kleine gemeenschap dat zijn eerste moord in twintig jaar tijd moet zien te verwerken. Dan wordt Reacher plots gearresteerd: getuigen zagen hem ten tijde van de misdaad op de locatie. Jack moet nu zijn onschuld zien te bewijzen.\"},\"name\":\"Nederlands\",\"iso_639_1\":\"nl\",\"iso_3166_1\":\"NL\",\"english_name\":\"Dutch\"},{\"data\":{\"name\":\"\",\"tagline\":\"Reacher powrócił.\",\"homepage\":\"\",\"overview\":\"Gdy oficer żandarmerii wojskowej w stanie spoczynku zostaje aresztowany za morderstwo, którego nie popełnił, okazuje się, że trafił w sam środek spisku pełnego umoczonych gliniarzy, podejrzanych biznesmenów i knujących polityków. Teraz musi dojść, co dzieje się w Margrave w stanie Georgia.\"},\"name\":\"Polski\",\"iso_639_1\":\"pl\",\"iso_3166_1\":\"PL\",\"english_name\":\"Polish\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Kun entinen sotilaspoliisi Jack Reacher pidätetään syyttömänä murhasta, hän joutuu keskelle vaarallista salaliittoa, jossa vilisee likaisia poliiseja, hämäriä liikemiehiä ja kieroja poliitikkoja. Reacher panee kaikki kykynsä peliin selvittääkseen, mitä georgialaisessa Margraven kaupungissa oikein tapahtuu.\"},\"name\":\"suomi\",\"iso_639_1\":\"fi\",\"iso_3166_1\":\"FI\",\"english_name\":\"Finnish\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Quando l'Ufficiale di Polizia Militare in congedo Jack Reacher viene arrestato per un omicidio che non ha commesso, si trova in una cospirazione fatale con poliziotti corrotti, loschi uomini d'affari e politici arrivisti. Con solo il suo ingegno, deve capire cosa sta succedendo a Margrave, Georgia.\"},\"name\":\"Italiano\",\"iso_639_1\":\"it\",\"iso_3166_1\":\"IT\",\"english_name\":\"Italian\"},{\"data\":{\"name\":\"ريتشر\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"يصل جاك ريتشر، الضابط السابق في الشرطة العسكرية، إلى بلدة مارغريف الصغيرة، لكنه يجد نفسه متورطًا في قضية قتل غامضة بعد وقت قصير من وصوله. يكتشف ريتشر أن الجريمة ليست حادثًا عابرًا، بل جزء من مؤامرة كبيرة تضم رجال أعمال ومسؤولين وشخصيات نافذة في البلدة. يتعاون مع الضابطة روسكو كونكلين والمحقق أوسكار فينلي لكشف الحقيقة، مستفيدًا من خبرته العسكرية وقدرته على التحقيق ومواجهة خصومه. ومع اتساع دائرة الخطر، يجد ريتشر نفسه في مواجهة شبكة إجرامية مستعدة لفعل أي شيء لإخفاء أسرارها.\"},\"name\":\"العربية\",\"iso_639_1\":\"ar\",\"iso_3166_1\":\"SA\",\"english_name\":\"Arabic\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Όταν μέλη της παλιάς στρατιωτικής μονάδας του Ρίτσερ αρχίζουν να εμφανίζονται νεκρά, ο Ρίτσερ έχει μόνο ένα πράγμα στο μυαλό του - την εκδίκηση\"},\"name\":\"ελληνικά\",\"iso_639_1\":\"el\",\"iso_3166_1\":\"GR\",\"english_name\":\"Greek\"},{\"data\":{\"name\":\"Ричър\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"По романите на Лий Чайлд. Джак Ричър е арестуван за убийство, но ситуацията иронично се обръща - полицията арестувала Джак Ричър се нуждае от помощта му.\"},\"name\":\"български език\",\"iso_639_1\":\"bg\",\"iso_3166_1\":\"BG\",\"english_name\":\"Bulgarian\"},{\"data\":{\"name\":\"Ричер\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Џек Ричер је ухапшен због убиства и сада је полицији потребна његова помоћ.\"},\"name\":\"Srpski\",\"iso_639_1\":\"sr\",\"iso_3166_1\":\"RS\",\"english_name\":\"Serbian\"},{\"data\":{\"name\":\"แจ็ค รีชเชอร์ ยอดคนสืบระห่ำ\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"เมื่ออดีตสารวัตรทหาร แจ็ค รีชเชอร์ได้ถูกจับในข้อหาฆาตกรรมที่เขาไม่ได้ก่อ เขาได้ตกไปอยู่ท่ามกลางแผนร้ายที่เกี่ยวพันกับตำรวจจอมคดโกง นักธุรกิจที่มีเงื่อนงำ และนักการเมืองคิดไม่ซื่อ เขามีเพียงสติปัญญาเป็นอาวุธ และเขาต้องหาคำตอบว่าเกิดอะไรขึ้นในมาร์เกรฟ รัฐจอร์เจีย\"},\"name\":\"ภาษาไทย\",\"iso_639_1\":\"th\",\"iso_3166_1\":\"TH\",\"english_name\":\"Thai\"},{\"data\":{\"name\":\"Річер\",\"tagline\":\"Річер повертається\",\"homepage\":\"\",\"overview\":\"Джека Річера, колишнього майора армійської військової поліції, заарештовують за підозрою у вбивстві. Знявши з себе підозри, герой сам береться за пошуки кілера.\"},\"name\":\"Український\",\"iso_639_1\":\"uk\",\"iso_3166_1\":\"UA\",\"english_name\":\"Ukrainian\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Saat pensiunan Polisi Militer Jack Reacher ditahan atas pembunuhan yang tak dia lakukan, Reacher mendapati dirinya dikelilingi konspirasi mematikan yang melibatkan polisi korup, pengusaha mencurigakan, dan politikus licik. Hanya berbekal nyali, dia harus cari tahu ada apa di Margrave, Georgia.\"},\"name\":\"Bahasa indonesia\",\"iso_639_1\":\"id\",\"iso_3166_1\":\"ID\",\"english_name\":\"Indonesian\"},{\"data\":{\"name\":\"რიჩერი\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"ჯეკ რიჩერი მკვლელობისთვის დააკავეს და ახლა პოლიციას მისი დახმარება სჭირდება. დაფუძნებულია ლი ჩაილდის წიგნებზე.\"},\"name\":\"ქართული\",\"iso_639_1\":\"ka\",\"iso_3166_1\":\"GE\",\"english_name\":\"Georgian\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Când Jack Reacher, fost ofițer în poliția militară, este arestat pentru o crimă necomisă, se trezește în mijlocul unei conspirații cu polițiști morți, afaceriști dubioși și politicieni intriganți. Pe baza istețimii sale, trebuie să-și dea seama ce se petrece în Margrave, Georgia.\"},\"name\":\"Română\",\"iso_639_1\":\"ro\",\"iso_3166_1\":\"RO\",\"english_name\":\"Romanian\"},{\"data\":{\"name\":\"Džekas Ryčeris\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Džekas Ryčeris buvo suimtas už žmogžudystę ir dabar policijai reikia jo pagalbos. Sukurta, remiantis Lee Child knygomis.\"},\"name\":\"Lietuvių\",\"iso_639_1\":\"lt\",\"iso_3166_1\":\"LT\",\"english_name\":\"Lithuanian\"},{\"data\":{\"name\":\"Reacher: Phát Súng Cuối Cùng\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Jack Reacher 2022: Phát Súng Cuối Cùng, kể về câu chuyện của Jack Reacher, một cựu cảnh sát hình sự, bị vướng vào một âm mưu vu oan to lớn, được thực hiện bởi một nhóm cảnh sát, doanh nhân lẫn chính trị gia biến chất. Reacher và vợ sẽ phải làm gì để thoát khỏi âm mưu này, nhất là sau cái chết của người anh mình?\"},\"name\":\"Tiếng Việt\",\"iso_639_1\":\"vi\",\"iso_3166_1\":\"VN\",\"english_name\":\"Vietnamese\"},{\"data\":{\"name\":\"リーチャー ～正義のアウトロー～\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"退役した元軍の警察官ジャック・リーチャーは身に覚えのない殺人容疑で逮捕される。そして自分が汚職警官や怪しいビジネスマン、策謀をめぐらせる政治家などがひしめきあい、命も落としかねない陰謀のまっただ中にいることを知る。ジョージア州マーグレイヴで起きていることを解明するしかない彼にとって、頼れるのは自分自身の頭脳だけ。\"},\"name\":\"日本語\",\"iso_639_1\":\"ja\",\"iso_3166_1\":\"JP\",\"english_name\":\"Japanese\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Serija prati Jacka Reachera, veterana vojnog policajca koji je tek nedavno ušao u civilni život. Reacher je lutalica, bez telefona i najnužnijih stvari dok putuje zemljom i istražuje naciju kojoj je nekoć služio. Kad Reacher stigne u gradić Margrave u Georgiji, zatekne zajednicu koja se bori s prvim ubojstvom u 20 godina. Policajci ga odmah uhapse, a očevici tvrde da su smjestili Reachera na mjesto zločina. Dok on radi na dokazivanju svoje nevinosti, počinje se pojavljivati duboko ukorijenjena zavjera koja će zahtijevati Reacherov oštroumni um i snažne šake da bi se s njom obračunao. Jedno je iznad svega sigurno: odabrali su pogrešnog tipa koji će pasti.\"},\"name\":\"Hrvatski\",\"iso_639_1\":\"hr\",\"iso_3166_1\":\"HR\",\"english_name\":\"Croatian\"},{\"data\":{\"name\":\"ریچر\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"ریچر؛ سریالی در ژانر جنایی مهیج محصول سرویس ویدئویی آمازون است. سریال بر اساس رُمان قتلگاه نوشتهٔ لی چایلد و با بازی آلن ریچسون در نقش اصلی است. تام کروز سابقا در دو فیلم نقش جک ریچر را ایفا کرده بود. یک کهنه سرباز پرافتخار به نام جک ریچر با ادعای شاهدان صحنه‌ جنایت، به جرم قتل در یک شهر کوچک متهم و دستگیر می‌شود. به همین دلیل جک ریچر تلاش می‌کند تا بی‌گناهی خود را با یافتن قاتل حقیقی ثابت کند و از این جرم بی‌پایه و اساس تبرئه شود اما…\"},\"name\":\"فارسی\",\"iso_639_1\":\"fa\",\"iso_3166_1\":\"IR\",\"english_name\":\"Persian\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Jack Reacher blev anholdt for mord, og nu har politiet brug for hans hjælp. Baseret på bøger af Lee Child.\"},\"name\":\"Dansk\",\"iso_639_1\":\"da\",\"iso_3166_1\":\"DK\",\"english_name\":\"Danish\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Quando o polícia do exército reformado Jack Reacher é detido por um homicídio que não cometeu, vê-se no meio duma conspiração mortal com polícias corruptos, homens de negócios obscuros e políticos calculistas. Baseado na saga literária de Lee Child.\"},\"name\":\"Português\",\"iso_639_1\":\"pt\",\"iso_3166_1\":\"PT\",\"english_name\":\"Portuguese\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Når den pensjonerte militæroffiseren Jack Reacher blir arrestert for et drap han ikke begikk, havner han midt i en dødelig konspirasjon full av korrupt politi, tvilsomme forretningsmenn og listige politikere. Med kun sin egen fornuft må han finne ut hva som skjer i Margrave i Georgia.\"},\"name\":\"Norsk\",\"iso_639_1\":\"no\",\"iso_3166_1\":\"NO\",\"english_name\":\"Norwegian\"},{\"data\":{\"name\":\"Reacher\",\"tagline\":\"Reacher je nazaj!\",\"homepage\":\"\",\"overview\":\"Jack Reacher je veteran vojaške policije, ki se je pred kratkim vrnil v civilno življenje. Je potepuh, ki nima telefona in nosi le najnujnejše stvari medtem, ko potuje po državi in rešuje zločine ter deli svojo lastno ulično pravico. Ko ga v Margraveju v Georgii aretirajo zaradi umora, ki ga ni zagrešil, se znajde sredi smrtonosne zarote podkupljenih policistov, sumljivih poslovnežev in spletkarskih politikov...\"},\"name\":\"Slovenščina\",\"iso_639_1\":\"sl\",\"iso_3166_1\":\"SI\",\"english_name\":\"Slovenian\"},{\"data\":{\"name\":\"ரீச்சர்\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"ஓய்வுபெற்ற மிலிட்டரி போலீஸ் அதிகாரி ஜாக் ரீச்சர் செய்யாத கொலைக்குக் கைதாகும்போது, மோசமான போலீஸார், தில்லுமுல்லு வணிகர்கள் மற்றும் சூழ்ச்சியான அரசியல்வாதிகள் நிறைந்த ஒரு கொடிய சதித்திட்டத்தில் தான் சிக்கியதை அறிகிறார். மார்க்ரேவ், ஜார்ஜியாவில் நடப்பதை தன் அறிவை மட்டுமே கொண்டு அவர் புரிந்து கொள்ள வேண்டும்.\"},\"name\":\"தமிழ்\",\"iso_639_1\":\"ta\",\"iso_3166_1\":\"IN\",\"english_name\":\"Tamil\"},{\"data\":{\"name\":\"రీచర్\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"రిటైర్డ్ మిలిటరీ పోలీస్ ఆఫీసర్ జాక్ రీచర్ తాను చేయని హత్యానేరంపై అరెస్ట్ అవుతాడు. లంచగొండి పోలీసులు, అక్రమ వ్యాపారవేత్తలు, అవినీతి నాయకుల కుట్రలో ఇరుక్కున్నాడని అతనికి అర్థమవుతుంది. అతను కేవలం తన తెలివితేటలతో జార్జియాలోని మార్‌గ్రేవ్‌లో ఏమి జరుగుతుందో కనిపెట్టాల్సి ఉంటుంది.\"},\"name\":\"తెలుగు\",\"iso_639_1\":\"te\",\"iso_3166_1\":\"IN\",\"english_name\":\"Telugu\"},{\"data\":{\"name\":\"रीचर\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"जब सेवानिवृत्त पुलिस अफ़सर जैक रीचर उस हत्या के लिए गिरफ़्तार किया जाता है जो उसने नहीं किया, वह खुद को एक भयंकर षड़्यंत्र में घिरा पाता है जिसमें कई भ्रष्ट पुलिसवाले, बेईमान व्यापारी और धूर्त राजनेता शामिल हैं। केवल अपनी समझ के सहारे, उसे पता लगाना होगा कि मारग्रेव, जॉर्जिया में क्या हो रहा है।\"},\"name\":\"हिन्दी\",\"iso_639_1\":\"hi\",\"iso_3166_1\":\"IN\",\"english_name\":\"Hindi\"},{\"data\":{\"name\":\"ريتشر\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"حين يُعتقل \\\"جاك ريتشر\\\" ضابط الشرطة العسكرية على جريمة قتل لم يرتكبها، يجد نفسه في وسط مؤامرة مميتة مليئة برجال الشرطة غير الشرفاء ورجال الأعمال المريبين والسياسيين الماكرين. عليه أن يستخدم ذكاءه ليكتشف ما يحدث في \\\"مارغريف\\\"، \\\"جورجيا\\\". الموسم الأول من \\\"جاك ريتشر\\\" مستوحى من أحد أفضل الكتب مبيعاً في العالم \\\"ذا كيلنغ فلور\\\" من تأليف \\\"لي تشايلد\\\".\"},\"name\":\"العربية\",\"iso_639_1\":\"ar\",\"iso_3166_1\":\"AE\",\"english_name\":\"Arabic\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Apabila pesara Pegawai Polis Tentera Jack Reacher ditangkap atas pembunuhan yang tidak dilakukannya, dia terjebak dalam konspirasi yang melibatkan polis korup, ahli perniagaan mencurigakan dan ahli politik licik. Dengan kepintarannya, dia perlu menyelesaikan misteri di Margrave, Georgia.\"},\"name\":\"Bahasa melayu\",\"iso_639_1\":\"ms\",\"iso_3166_1\":\"MY\",\"english_name\":\"Malay\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Nang inaresto ang retiradong Opisyal ng Militar na si Jack Reacher dahil sa pagpatay na hindi niya ginawa, napagitna siya sa pagsasabwatan ng mga masasamang pulis, negosyante at mga pulitikong may masamang balak. Gamit lamang ang talino, kailangan niyang alamin kung ano ang nangyayari sa Margrave, Georgia.\"},\"name\":\"\",\"iso_639_1\":\"tl\",\"iso_3166_1\":\"PH\",\"english_name\":\"Tagalog\"},{\"data\":{\"name\":\"神隱任務\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"退伍憲兵傑克李奇遭人誣陷殺人而被逮捕，陷入一場充滿腐敗警察、可疑商人，及陰險政客的陰謀之中。他只能憑藉自己的聰慧，查出喬治亞州馬格雷夫到底發生什麼事。第一季劇情改編自李查德的國際暢銷小說《地獄藍調》。\"},\"name\":\"普通话\",\"iso_639_1\":\"zh\",\"iso_3166_1\":\"HK\",\"english_name\":\"Mandarin\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"En Jack Reacher, agent retirat de la policia militar, és arrestat per un assassinat que no va cometre i es troba, de sobte, enmig d'una conspiració amb policies corruptes, negocis tèrbols i polítics poc honestos. En Reacher haurà de fer servir el seu enginy per esbrinar què està passant a Margrave, Geòrgia. La primera temporada de Reacher està basada en el best-seller Killing Floor de Lee Child.\"},\"name\":\"Català\",\"iso_639_1\":\"ca\",\"iso_3166_1\":\"ES\",\"english_name\":\"Catalan\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Jack Reacher Polizia Militarreko agente erretiratua egin ez duen hilketa batengatik atxilotzen dutenean, polizia ustel, enpresari ilun eta politikari azpikariz beteriko konspirazio hilkor batean murgilduko da. Bere zorroztasuna erabiliz, Georgiako Margrave herrian zer gertatzen den argitu beharko du. Reacher saioaren lehenengo denboraldia Lee Childen nazioarteko bestsellerrean oinarrituta dago.\"},\"name\":\"euskera\",\"iso_639_1\":\"eu\",\"iso_3166_1\":\"ES\",\"english_name\":\"Basque\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Ancien officier de Police Militaire, Jack Reacher est arrêté pour un meurtre qu'il n'a pas commis et découvre une conspiration sanglante où baignent flics véreux, hommes d'affaire louches et politiciens corrompus. Avec son astuce pour seule arme, il va déjouer ce qui se trame à Margrave en Géorgie. La première saison de «Reacher» est adaptée du Best-seller de Lee Child «Du fond de l'abîme»\"},\"name\":\"Français\",\"iso_639_1\":\"fr\",\"iso_3166_1\":\"CA\",\"english_name\":\"French\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Cando o arrestan por un asasinato que non cometeu, o policía militar Jack Reacher enrédase nunha conspiración letal de policías corruptos, empresarios turbios e políticos maquinadores. Co seu enxeño nada máis, ten que descubrir o que está a pasar en Margrave, Xeorxia. A primeira tempada de Reacher está baseada no best-séller internacional Killing Floor, de Lee Child.\"},\"name\":\"Galego\",\"iso_639_1\":\"gl\",\"iso_3166_1\":\"ES\",\"english_name\":\"Galician\"},{\"data\":{\"name\":\"ರೀಚರ್\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"ನಿವೃತ್ತ ಮಿಲಿಟರಿ ಪೊಲೀಸ್ ಅಧಿಕಾರಿ ಜ್ಯಾಕ್ ರೀಚರ್ ತಾನು ಮಾಡದ ಕೊಲೆಗಾಗಿ ಬಂಧಿಸಲ್ಪಟ್ಟಾಗ, ಕೆಟ್ಟ ಪೊಲೀಸರು, ಕಂತ್ರಿ ಉದ್ಯಮಿಗಳು, ಕುತಂತ್ರಿ ಮತ್ತು ರಾಜಕಾರಣಿಗಳ ಮಾರಣಾಂತಿಕ ಪಿತೂರಿಯ ಮಧ್ಯದಲ್ಲಿ ಸಿಲುಕಿ ಕೊಳ್ಳುತ್ತಾನೆ. ಜಾರ್ಜಿಯಾದ ಮಾರ್ಗ್ರೇವ್‌ನಲ್ಲಿ ಏನು ನಡೆಯುತ್ತಿದೆ ಎಂಬುದನ್ನು ಅವನು ತನ್ನ ಬುದ್ಧಿವಂತಿಕೆ ಮಾತ್ರ ಬಳಸಿ ಕಂಡುಹಿಡಿಯಬೇಕು. ರೀಚರ್‌ನ ಮೊದಲ ಸೀಸನ್ ಅಂತರಾಷ್ಟ್ರೀಯ ಬೆಸ್ಟ್ ಸೆಲ್ಲರ್, ಲೀ ಚೈಲ್ಡ್ ಅವರ ದಿ ಕಿಲ್ಲಿಂಗ್ ಫ್ಲೋರ್ ಅನ್ನು ಆಧರಿಸಿದೆ.\"},\"name\":\"?????\",\"iso_639_1\":\"kn\",\"iso_3166_1\":\"IN\",\"english_name\":\"Kannada\"},{\"data\":{\"name\":\"റീച്ചർ\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"താൻ ചെയ്യാത്ത ഒരു കൊലപാതകത്തിന് എക്സ് മിലിട്ടറി പോലീസ് ഓഫീസർ ജാക്ക് റീച്ചർ അറസ്റ്റിലാകുമ്പോൾ, ഒരുപാട് പ്രമുഖർ ഉൾപ്പെടുന്ന ഒരു വലിയ ഗൂഢാലോചനയുടെ ഇരയായിരിക്കുന്നു താനെന്ന് അയാൾ മനസ്സിലാക്കുന്നു. ആരുടേയും സഹായമില്ലാതെ, ജോർജിയയിലെ മാർഗ്രേവിൽ എന്താണ് സംഭവിക്കുന്നതെന്ന് അയാൾക്ക് കണ്ടുപിടിച്ചേ മതിയാകൂ . റീച്ചറിന്റെ ആദ്യ സീസൺ ലീ ചൈൽഡിന്റെ ദി കില്ലിംഗ് ഫ്ലോറിനെ അടിസ്ഥാനമാക്കിയുള്ളതാണ്.\"},\"name\":\"\",\"iso_639_1\":\"ml\",\"iso_3166_1\":\"IN\",\"english_name\":\"Malayalam\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Džeks Reičers, militārās policijas izmeklētājs veterāns, pavisam nesen ir uzsācis civilo dzīvi. Reičers ir klaidonis, bez telefona un ar visnepieciešamākajām lietām, kas ceļo pa valsti, kurai viņš reiz kalpoja un iepazīst to.\"},\"name\":\"Latviešu\",\"iso_639_1\":\"lv\",\"iso_3166_1\":\"LV\",\"english_name\":\"Latvian\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Jack Reacher, dlhoročný vyšetrovateľ vojenskej polície, nedávno vstúpil do civilného života. Je to tulák, ktorý so sebou nenosí telefón a má len to najnutnejšie, cestuje po krajine a objavuje národ, ktorému kedysi slúžil.\"},\"name\":\"Slovenčina\",\"iso_639_1\":\"sk\",\"iso_3166_1\":\"SK\",\"english_name\":\"Slovak\"},{\"data\":{\"name\":\"侠探杰克\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"退役宪兵警察杰克雷彻被误认为是谋杀嫌疑人而被捕，他发现自己卷入了一场致命的阴谋之中。这桩阴谋涉及了黑警、奸商以及狡诈的政客。他只能凭借自己的机智将佐治亚州马格雷夫的案件查个水落石出。《侠探杰克》第一季改编自李查德的全球畅销小说《杀戮空间》。\"},\"name\":\"普通话\",\"iso_639_1\":\"zh\",\"iso_3166_1\":\"SG\",\"english_name\":\"Mandarin\"},{\"data\":{\"name\":\"\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"Jack Reacher is een veteraan, die als inspecteur bij de militaire politie heeft gewerkt. Nu probeert hij in het burgerlijk leven te integreren. Reacher reist het land door, zonder telefoon op zak en uitgerust met slechts het minimaal benodigde. Op zijn reizen doorkruist hij het land dat hij ooit gediend heeft. Wanneer Reacher aankomt in het kleine dorp Margrave in Georgia, is hij getuige van een kleine gemeenschap dat zijn eerste moord in twintig jaar tijd moet zien te verwerken. Dan wordt Reacher plots gearresteerd: getuigen zagen hem ten tijde van de misdaad op de locatie. Jack moet nu zijn onschuld zien te bewijzen.\"},\"name\":\"Nederlands\",\"iso_639_1\":\"nl\",\"iso_3166_1\":\"BE\",\"english_name\":\"Dutch\"},{\"data\":{\"name\":\"ریچر\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"جب ریٹائرڈ پولیس افسر جیک ریچر کو ایک ایسے قتل کے الزام میں گرفتار کیا جاتا ہے جو اس نے نہیں کیا، تو وہ خود کو بدعنوان پولیس افسران، بے ایمان کاروباری افراد اور مکار سیاست دانوں پر مشتمل ایک مہلک سازش میں گھرا ہوا پاتا ہے۔ اپنی ذہانت اور فہم و فراست پر مکمل انحصار کرتے ہوئے، اسے یہ پتا لگانا ہے کہ مارگریو، جارجیا میں دراصل کیا ہو رہا ہے۔\"},\"name\":\"اردو\",\"iso_639_1\":\"ur\",\"iso_3166_1\":\"PK\",\"english_name\":\"Urdu\"},{\"data\":{\"name\":\"Рычар\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"\"},\"name\":\"беларуская мова\",\"iso_639_1\":\"be\",\"iso_3166_1\":\"BY\",\"english_name\":\"Belarusian\"},{\"data\":{\"name\":\"Ричер\",\"tagline\":\"\",\"homepage\":\"\",\"overview\":\"\"},\"name\":\"\",\"iso_639_1\":\"mk\",\"iso_3166_1\":\"MK\",\"english_name\":\"Macedonian\"}]},\"vote_average\":8.11,\"backdrop_path\":\"/pF0qkRsrHkdYadPWY9AMeFZfcwk.jpg\",\"in_production\":true,\"last_air_date\":\"2026-09-02\",\"original_name\":\"Reacher\",\"first_air_date\":\"2022-02-03\",\"origin_country\":[\"US\"],
