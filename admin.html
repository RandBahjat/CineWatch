<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>CineWatch Admin Tools</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0c10;
      color: #fff;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #66fcf1; }
    .card {
      background: #1f2833;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #c5c6c7;
      font-size: 0.9rem;
    }
    input, select {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.2rem;
      background: #0b0c10;
      border: 1px solid #45a29e;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #45a29e;
      color: #0b0c10;
      border: none;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #66fcf1; }
    textarea {
      width: 100%;
      height: 300px;
      background: #0b0c10;
      color: #66fcf1;
      border: 1px solid #45a29e;
      border-radius: 4px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      box-sizing: border-box;
      white-space: pre;
    }
    .success { color: #66fcf1; margin-top: 1rem; display: none; }
    .error { color: #ff6b6b; margin-top: 1rem; display: none; }
  </style>
</head>
<body>

  <h1>🎬 CineWatch Admin Tools</h1>
  <p>Generate JSON code for `movie.js` instantly using the TMDB API.</p>

  <div class="card" style="border: 2px solid #66fcf1;">
    <h3>📊 Site Analytics</h3>
    <div style="display: flex; gap: 2rem;">
      <div>
        <label>Total Page Views</label>
        <h2 id="analyticsViews" style="margin: 0; color: #fff;">Loading...</h2>
      </div>
      <div>
        <label>Total Registered Users</label>
        <h2 id="analyticsUsers" style="margin: 0; color: #fff;">Loading...</h2>
      </div>
    </div>
    <button onclick="fetchAnalytics()" style="margin-top: 1rem; padding: 0.5rem 1rem; font-size: 0.8rem;">Refresh Stats</button>
  </div>

  <div class="card">
    <h3>1. Setup (One Time)</h3>
    <label>TMDB API Read Access Token (v4)</label>
    <input type="password" id="tmdbToken" placeholder="Paste your long TMDB Bearer Token here..." />
    <button onclick="saveToken()">Save Token</button>
    <span id="tokenMsg" class="success">Token saved!</span>
  </div>

  <div class="card">
    <h3>2. Generate Movie Code</h3>
    <label>TMDB ID</label>
    <input type="text" id="tmdbId" placeholder="e.g. 533535 (Deadpool & Wolverine)" />
    
    <label>Type</label>
    <select id="mediaType">
      <option value="movie">Movie</option>
      <option value="tv">TV Show</option>
    </select>

    <button onclick="generateCode()">Fetch & Generate Code</button>
    <div id="errMsg" class="error"></div>
  </div>

  <div class="card" id="resultCard" style="display: none;">
    <h3>3. Copy & Paste into movie.js</h3>
    <p>Copy this block and paste it at the bottom of the <code>MOVIES</code> array in <code>movie.js</code>.</p>
    <textarea id="resultCode" readonly></textarea>
    <button style="margin-top: 1rem;" onclick="copyCode()">Copy to Clipboard</button>
  </div>

  <script>
    // Load token on startup
    document.addEventListener("DOMContentLoaded", () => {
      const savedToken = localStorage.getItem("tmdb_token");
      if (savedToken) document.getElementById("tmdbToken").value = savedToken;
    });

    function saveToken() {
      const token = document.getElementById("tmdbToken").value.trim();
      localStorage.setItem("tmdb_token", token);
      const msg = document.getElementById("tokenMsg");
      msg.style.display = "inline";
      setTimeout(() => msg.style.display = "none", 2000);
    }

    // --- ANALYTICS LOGIC ---
    function fetchAnalytics() {
      fetch('https://cinewatch-maaa.onrender.com/api/stats')
        .then(res => res.json())
        .then(data => {
          document.getElementById('analyticsViews').textContent = data.totalViews || 0;
          document.getElementById('analyticsUsers').textContent = data.totalUsers || 0;
        })
        .catch(err => {
          console.error("Failed to fetch stats", err);
          document.getElementById('analyticsViews').textContent = "Error";
          document.getElementById('analyticsUsers').textContent = "Error";
        });
    }
    
    // Load stats immediately
    fetchAnalytics();

    // --- TMDB FETCH LOGIC ---
    async function generateCode() {
      const token = document.getElementById("tmdbToken").value.trim();
      const id = document.getElementById("tmdbId").value.trim();
      const type = document.getElementById("mediaType").value;
      const err = document.getElementById("errMsg");
      
      err.style.display = "none";
      if (!token || !id) {
        err.textContent = "Please provide both an API token and a TMDB ID.";
        err.style.display = "block";
        return;
      }

      try {
        const options = {
          method: 'GET',
          headers: {
            accept: 'application/json',
            Authorization: `Bearer ${token}`
          }
        };

        // Fetch Details
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}`, options);
        if (!res.ok) throw new Error("TMDB request failed. Check your ID and Token.");
        const data = await res.json();

        // Fetch Credits (for actors)
        const credRes = await fetch(`https://api.themoviedb.org/3/${type}/${id}/credits`, options);
        const credData = credRes.ok ? await credRes.json() : { cast: [] };

        // Process data
        const title = type === 'movie' ? data.title : data.name;
        const year = (type === 'movie' ? data.release_date : data.first_air_date)?.substring(0, 4) || new Date().getFullYear();
        const rating = (data.vote_average || 0).toFixed(1);
        const overview = data.overview ? data.overview.replace(/"/g, '\\"') : "";
        const poster = data.poster_path ? `https://image.tmdb.org/t/p/w600_and_h900_face${data.poster_path}` : "";
        const backdrop = data.backdrop_path ? `https://image.tmdb.org/t/p/original${data.backdrop_path}` : "";
        const genres = data.genres ? data.genres.map(g => g.name) : [];
        
        let durationStr = "1h 30m";
        if (type === 'movie' && data.runtime) {
          const h = Math.floor(data.runtime / 60);
          const m = data.runtime % 60;
          durationStr = `${h}h ${m}m`;
        }

        const actors = credData.cast.slice(0, 3).map(c => c.name);

        // Generate JSON block string
        let jsonStr = `  {\n`;
        jsonStr += `    title: "${title.replace(/"/g, '\\"')}",\n`;
        jsonStr += `    type: "${type === 'movie' ? 'Movie' : 'TV Show'}",\n`;
        jsonStr += `    year: ${year},\n`;
        jsonStr += `    rating: ${rating},\n`;
        jsonStr += `    age: "PG-13",\n`;
        if (type === 'movie') jsonStr += `    duration: "${durationStr}",\n`;
        jsonStr += `    genres: ${JSON.stringify(genres)},\n`;
        jsonStr += `    poster: "${poster}",\n`;
        jsonStr += `    backdrop: "${backdrop}",\n`;
        if (type === 'movie') jsonStr += `    videoUrl: "${id}",\n`;
        else jsonStr += `    cinesrcId: "${id}",\n`;
        jsonStr += `    overview: "${overview}",\n`;
        jsonStr += `    director: "Unknown",\n`;
        jsonStr += `    cast: ${JSON.stringify(actors)},\n`;
        
        if (type === 'tv' && data.number_of_seasons) {
          jsonStr += `    seasons: [\n`;
          jsonStr += `      {\n`;
          jsonStr += `        season: 1,\n`;
          jsonStr += `        episodes: [\n`;
          jsonStr += `          { episode: 1, title: "Episode 1" }\n`;
          jsonStr += `        ]\n`;
          jsonStr += `      }\n`;
          jsonStr += `    ],\n`;
        }
        
        jsonStr += `  },`;

        document.getElementById("resultCode").value = jsonStr;
        document.getElementById("resultCard").style.display = "block";
      } catch (e) {
        err.textContent = e.message;
        err.style.display = "block";
      }
    }

    function copyCode() {
      const ta = document.getElementById("resultCode");
      ta.select();
      document.execCommand("copy");
      alert("Copied to clipboard!");
    }
  </script>
</body>
</html>
