<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>Reset Password - CineWatch</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b0c10; color: #fff; padding: 2rem; max-width: 400px; margin: 5rem auto; text-align: center; }
    h1 { color: #66fcf1; }
    .card { background: #1f2833; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input { width: 100%; padding: 0.8rem; margin: 1rem 0; border-radius: 4px; border: 1px solid #45a29e; background: #0b0c10; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 1rem; background: #66fcf1; color: #0b0c10; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #45a29e; color: white; }
    .error { color: #ff4c4c; font-size: 0.9rem; margin-top: 1rem; display: none; }
    .success { color: #66fcf1; font-size: 0.9rem; margin-top: 1rem; display: none; }
    .spinner { display: none; }
    a { color: #66fcf1; text-decoration: none; display: block; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>CineWatch</h1>
  <div class="card">
    <h2>Reset Password</h2>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
      <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6">
      <button type="submit" id="submitBtn">Reset Password <span class="spinner">...</span></button>
    </form>
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>
    <a href="index.html">Back to Home</a>
  </div>

  <script src="api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      const form = document.getElementById('resetForm');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.querySelector('.spinner');

      if (!token) {
        form.style.display = 'none';
        errorMsg.textContent = "Invalid or missing reset token.";
        errorMsg.style.display = 'block';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          errorMsg.textContent = "Passwords do not match!";
          errorMsg.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        spinner.style.display = 'inline';

        const { data, error } = await window.CW_API.confirmPasswordReset(token, newPassword);

        submitBtn.disabled = false;
        spinner.style.display = 'none';

        if (error) {
          errorMsg.textContent = error;
          errorMsg.style.display = 'block';
        } else {
          form.style.display = 'none';
          successMsg.textContent = "Password successfully reset! You can now log in.";
          successMsg.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
