name: CineWatch Smart IMDb Ratings Bot

on:
  schedule:
    # Runs automatically twice every day at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CineWatch Ratings Bot
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY || '69bc6809' }}
        run: |
          node ratings_bot.js --batch=60 --recent

      - name: Commit and Push Updated Ratings
        run: |
          git config --global user.name "CineWatch Ratings Bot"
          git config --global user.email "bot@cinewatch.watch"
          git add movies-data.js series-data.js anime-data.js fourk-data.js cinewatch-app/ index.html cinewatch-app/index.html .ratings_bot_cache.json
          git diff --staged --quiet || (git commit -m "🤖 [Ratings Bot] Auto-updated IMDb ratings [skip ci]" && git push)
